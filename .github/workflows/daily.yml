name: daily

on:
  schedule:
    - cron: '0 1 * * *' # UTC 01:00 = 北京 09:00
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ai-daily
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate digest
        env:
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          BARK_KEY: ${{ secrets.BARK_KEY }}
          SITE_URL: ${{ vars.SITE_URL }}
          FEEDBACK_POST_URL: ${{ vars.FEEDBACK_POST_URL }}
          FEEDBACK_READ_URL: ${{ secrets.FEEDBACK_READ_URL }}
          FEEDBACK_WRITE_URL: ${{ secrets.FEEDBACK_WRITE_URL }}
        run: python -m src.run

      - name: Commit and push
        run: |
          git config user.name "ai-daily-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs data/seen.json
          if git diff --staged --quiet; then
            echo "nothing to commit"
          else
            git commit -m "chore: daily $(date -u +%F)"
            git push
          fi

      - name: Notify on failure
        if: failure()
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}
        run: python -m src.publish.bark --alert
