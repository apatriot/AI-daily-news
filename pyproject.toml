[project]
name = "ai-daily"
version = "0.1.0"
description = "Personal AI daily digest, generated daily by GitHub Actions."
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27",
  "feedparser>=6.0.11",
  "Jinja2>=3.1",
  "PyYAML>=6.0",
  "python-dateutil>=2.9",
]

[tool.ruff]
line-length = 100
target-version = "py310"
