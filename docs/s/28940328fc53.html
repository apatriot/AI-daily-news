  <h1 class="detail-title">千问辟谣：周昊离职不实，将起诉自媒体&#34;Top华人科创社&#34;</h1>

  <p class="detail-summary">11月27日，针对自媒体&#34;Top华人科创社&#34;当日发布的《Qwen 后训练负责人周浩离职》一文，千问大模型官方回应称：内容纯属造谣，并将起诉追究其法律责任。 千问指出，该文章不仅杜撰事实，连当事人姓名都写错——被涉及人员实为&#34;周昊&#34;，而非文中所称&#34;周浩&#34;。千问称，近期针对Qwen大模型团队的不实信息持续出现，公司将依法追究相关主体的法律责任。</p>
