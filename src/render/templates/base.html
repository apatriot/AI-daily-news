<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#fafaf9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="AI 日报">
  <link rel="manifest" href="{{ root }}manifest.webmanifest">
  <link rel="apple-touch-icon" href="{{ root }}assets/icon.png">
  <link rel="stylesheet" href="{{ root }}assets/style.css">
  <title>{% block title %}AI 日报{% endblock %}</title>
</head>
<body>
  <div class="progress" id="progress" aria-hidden="true"></div>
  {% block content %}{% endblock %}
  <script>window.__AI_DAILY__ = {{ {"date": date_key, "feedbackUrl": feedback_url, "page": page|default("index"), "storyId": story_id|default("")}|tojson }};</script>
  <script src="{{ root }}assets/app.js" defer></script>
</body>
</html>
