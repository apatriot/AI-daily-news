# 关键词 → 簇 / 子话题，用于没有 LLM 时的兜底分类
keyword_rules:
  frontier:
    keywords: [model, benchmark, pretrain, training, inference, scaling, gpt, claude, gemini, llama, qwen, deepseek, 模型, 训练, 推理, 基准, 大模型]
    subtopics:
      new-model: [release, 发布, gpt, claude, gemini, llama, qwen, deepseek, 模型]
      research: [paper, research, 论文, 研究, benchmark, 基准]
  product:
    keywords: [agent, copilot, app, product, feature, coding, assistant, 产品, 助手, 编程, 智能体]
    subtopics:
      agents: [agent, 智能体, workflow]
      coding: [coding, code, 编程, developer, 开发者]
  industry:
    keywords: [funding, raise, acquisition, policy, regulation, lawsuit, 融资, 收购, 监管, 政策]
    subtopics:
      funding: [funding, raise, 融资, 估值, 上市]
      policy: [policy, regulation, 监管, 政策, 法案, 网信办, 工信部]
  oss:
    keywords: [open source, github, release, weights, 开源, 权重, 部署, quantization, 推理优化]
    subtopics:
      open-model: [open source, weights, 开源, 权重]
      tooling: [github, tool, 部署, quantization, 推理优化, 工具]
