      new-model: [release, 发布, gpt, claude, gemini, llama, qwen, deepseek]
      research: [paper, research, 论文, 研究, benchmark]
  product:
    keywords: [agent, copilot, app, product, feature, coding, assistant, 产品, 助手, 编程]
    subtopics:
      agents: [agent, 智能体, workflow]
      coding: [coding, code, 编程, developer]
  industry:
    keywords: [funding, raise, acquisition, policy, regulation, lawsuit, 融资, 收购, 监管, 政策]
    subtopics:
      funding: [funding, raise, 融资, 估值]
      policy: [policy, regulation, 监管, 政策, 法案]
  oss:
    keywords: [open source, github, release, weights, 开源, 权重, 部署, quantization]
